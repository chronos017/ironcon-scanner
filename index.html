<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>IRONCON Event Check-In</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h1 {
  margin-top: 0;
  text-align: center;
  font-size: 24px;
}

h2 {
  margin-top: 0;
  font-size: 20px;
}

.event-info {
  text-align: center;
  line-height: 1.6;
}

.event-name {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 10px;
}

.status {
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  margin-bottom: 15px;
  background: #eee;
}

#reader {
  width: 100%;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
}

.start {
  background: #1f5eff;
  color: white;
}

.stop {
  background: #555;
  color: white;
}

.manual {
  background: #222;
  color: white;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

.result {
  display: none;
}

.success {
  border-left: 6px solid #168a3b;
}

.warning {
  border-left: 6px solid #e69b00;
}

.error {
  border-left: 6px solid #c62828;
}

.employee-info {
  line-height: 1.8;
}

.label {
  font-weight: bold;
}

.small {
  font-size: 13px;
  color: #666;
}

</style>

</head>


<body>

<div class="container">

  <div class="card">

    <h1>IRONCON</h1>

    <div
      id="eventInfo"
      class="event-info"
    >
      Connecting to event API...
    </div>

  </div>


  <div
    id="status"
    class="status"
  >
    Loading active event...
  </div>


  <div class="card">

    <div id="reader"></div>

    <button
      id="startButton"
      class="start"
      onclick="startScanner()"
    >
      START CAMERA
    </button>

    <button
      id="stopButton"
      class="stop"
      onclick="stopScanner()"
      style="display:none;"
    >
      STOP CAMERA
    </button>

  </div>


  <div class="card">

    <h2>Manual Security Code</h2>

    <input
      type="text"
      id="manualCode"
      placeholder="Enter Security Code"
    >

    <button
      class="manual"
      onclick="verifyManualCode()"
    >
      VERIFY CODE
    </button>

  </div>


  <div
    id="result"
    class="card result"
  ></div>

</div>


<script>

/************************************************************
 * APP 2 — EVENT CHECK-IN QR SCANNER
 ************************************************************/


/************************************************************
 * APP 3 API URL
 *
 * IMPORTANT:
 * Replace this only if you create a new App 3 deployment.
 ************************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbyQuz0hchyOMX3bpAc08PSBvAzO-88SrFCZR8t7Kz7sdegaSxANZlQihKyud7zEx9nt/exec";


let currentEvent = null;

let html5QrCode = null;

let scannerRunning = false;

let processingScan = false;


/************************************************************
 * PAGE LOAD
 ************************************************************/

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadActiveEvent();

  }
);


/************************************************************
 * API REQUEST
 ************************************************************/

async function apiRequest(
  action,
  params = {}
) {

  const query =
    new URLSearchParams();

  query.append(
    "action",
    action
  );

  Object.keys(params).forEach(
    function(key) {

      query.append(
        key,
        params[key]
      );

    }
  );

  const response =
    await fetch(
      API_URL +
      "?" +
      query.toString(),
      {
        method: "GET",
        cache: "no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      "API request failed: " +
      response.status
    );

  }

  return await response.json();

}


/************************************************************
 * LOAD ACTIVE EVENT
 ************************************************************/

async function loadActiveEvent() {

  setStatus(
    "Loading active event...",
    "normal"
  );

  try {

    const result =
      await apiRequest(
        "getActiveEvent"
      );

    if (!result.success) {

      throw new Error(
        result.message ||
        "No active event found."
      );

    }

    currentEvent =
      result.event;

    displayEvent(
      currentEvent
    );

    setStatus(
      "Ready for event check-in.",
      "normal"
    );

  }

  catch (error) {

    console.error(error);

    document.getElementById(
      "eventInfo"
    ).innerHTML =

      "<strong>Unable to load active event</strong>" +
      "<br>" +
      escapeHtml(
        error.message
      );

    setStatus(
      "API connection failed.",
      "error"
    );

  }

}


/************************************************************
 * DISPLAY EVENT
 ************************************************************/

function displayEvent(event) {

  const eventInfo =
    document.getElementById(
      "eventInfo"
    );

  eventInfo.innerHTML =

    '<div class="event-name">' +
      escapeHtml(
        event.eventName ||
        "Event"
      ) +
    '</div>' +

    '<div>' +
      escapeHtml(
        event.eventDate ||
        ""
      ) +
    '</div>' +

    '<div>' +
      escapeHtml(
        event.eventTime ||
        ""
      ) +
    '</div>' +

    '<div>' +
      escapeHtml(
        event.eventVenue ||
        ""
      ) +
    '</div>';

}


/************************************************************
 * START SCANNER
 ************************************************************/

async function startScanner() {

  if (scannerRunning) {
    return;
  }

  if (!currentEvent) {

    showResult(
      false,
      "No active event is available."
    );

    return;

  }

  html5QrCode =
    new Html5Qrcode(
      "reader"
    );

  try {

    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.70;

          return {
            width: size,
            height: size
          };

        }

      },

      onScanSuccess,

      onScanFailure

    );

    scannerRunning = true;

    document.getElementById(
      "startButton"
    ).style.display =
      "none";

    document.getElementById(
      "stopButton"
    ).style.display =
      "block";

    setStatus(
      "Camera active. Scan employee QR.",
      "normal"
    );

  }

  catch (error) {

    console.error(error);

    showResult(
      false,
      "Unable to access camera. Please allow camera permission in your browser."
    );

  }

}


/************************************************************
 * STOP SCANNER
 ************************************************************/

async function stopScanner() {

  if (
    !html5QrCode ||
    !scannerRunning
  ) {
    return;
  }

  try {

    await html5QrCode.stop();

  }

  catch (error) {

    console.error(error);

  }

  scannerRunning = false;

  document.getElementById(
    "startButton"
  ).style.display =
    "block";

  document.getElementById(
    "stopButton"
  ).style.display =
    "none";

  setStatus(
    "Camera stopped.",
    "normal"
  );

}


/************************************************************
 * QR SCAN SUCCESS
 ************************************************************/

async function onScanSuccess(
  decodedText
) {

  if (processingScan) {
    return;
  }

  processingScan = true;

  try {

    await stopScanner();

    await verifyCode(
      decodedText
    );

  }

  finally {

    processingScan = false;

  }

}


/************************************************************
 * QR SCAN FAILURE
 ************************************************************/

function onScanFailure(error) {

  // Normal scanning failures are ignored.

}


/************************************************************
 * VERIFY QR CODE
 ************************************************************/

async function verifyCode(
  code
) {

  if (!code) {

    showResult(
      false,
      "No QR data was received."
    );

    return;

  }

  setStatus(
    "Verifying employee...",
    "normal"
  );

  try {

    /*
     * IMPORTANT:
     * App 3 expects parameter:
     *
     * data=
     *
     * NOT:
     *
     * code=
     */

    const result =
      await apiRequest(
        "verifySecurityCode",
        {
          data: code
        }
      );

    handleVerificationResult(
      result
    );

  }

  catch (error) {

    console.error(error);

    showResult(
      false,
      "Unable to contact event API: " +
      error.message
    );

  }

}


/************************************************************
 * MANUAL CODE
 ************************************************************/

async function verifyManualCode() {

  const input =
    document.getElementById(
      "manualCode"
    );

  const code =
    input.value.trim();

  if (!code) {

    showResult(
      false,
      "Please enter a Security Code."
    );

    return;

  }

  await verifyCode(
    code
  );

}


/************************************************************
 * HANDLE VERIFICATION RESULT
 ************************************************************/

function handleVerificationResult(
  result
) {

  if (!result.success) {

    showResult(
      false,
      result.message ||
      "Invalid Security Code."
    );

    setStatus(
      "Check-in failed.",
      "error"
    );

    return;

  }

  if (
    result.alreadyCheckedIn
  ) {

    showEmployeeResult(
      result.attendee,
      true
    );

    setStatus(
      "Employee already checked in.",
      "warning"
    );

    return;

  }

  showEmployeeResult(
    result.attendee,
    false
  );

  setStatus(
    "Check-in successful.",
    "success"
  );

}


/************************************************************
 * SHOW EMPLOYEE RESULT
 ************************************************************/

function showEmployeeResult(
  attendee,
  alreadyCheckedIn
) {

  const result =
    document.getElementById(
      "result"
    );

  result.style.display =
    "block";

  result.className =
    "card result " +
    (
      alreadyCheckedIn
        ? "warning"
        : "success"
    );

  const employeeName =
    attendee.employeeName ||
    attendee.fullName ||
    "";

  const employeeCode =
    attendee.employeeCode ||
    attendee.employeeNumber ||
    "";

  result.innerHTML =

    "<h2>" +

      (
        alreadyCheckedIn
          ? "ALREADY CHECKED IN"
          : "CHECK-IN SUCCESSFUL"
      ) +

    "</h2>" +

    '<div class="employee-info">' +

      "<div>" +
        '<span class="label">Employee Name:</span> ' +
        escapeHtml(
          employeeName
        ) +
      "</div>" +

      "<div>" +
        '<span class="label">Employee Code:</span> ' +
        escapeHtml(
          employeeCode
        ) +
      "</div>" +

      "<div>" +
        '<span class="label">Security Code:</span> ' +
        escapeHtml(
          attendee.securityCode ||
          ""
        ) +
      "</div>" +

      (
        attendee.checkInTime
          ?
          "<div>" +
            '<span class="label">Check-In Time:</span> ' +
            escapeHtml(
              formatDateTime(
                attendee.checkInTime
              )
            ) +
          "</div>"
          :
          ""
      ) +

    "</div>";

}


/************************************************************
 * SHOW RESULT MESSAGE
 ************************************************************/

function showResult(
  success,
  message
) {

  const result =
    document.getElementById(
      "result"
    );

  result.style.display =
    "block";

  result.className =
    "card result " +
    (
      success
        ? "success"
        : "error"
    );

  result.innerHTML =

    "<h2>" +

      (
        success
          ? "SUCCESS"
          : "ERROR"
      ) +

    "</h2>" +

    "<div>" +
      escapeHtml(
        message
      ) +
    "</div>";

}


/************************************************************
 * STATUS
 ************************************************************/

function setStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    message;

  if (type === "success") {

    status.style.background =
      "#dff5e5";

  }
  else if (type === "error") {

    status.style.background =
      "#fde2e2";

  }
  else if (type === "warning") {

    status.style.background =
      "#fff1cc";

  }
  else {

    status.style.background =
      "#eee";

  }

}


/************************************************************
 * FORMAT DATE
 ************************************************************/

function formatDateTime(
  value
) {

  if (!value) {
    return "";
  }

  const date =
    new Date(value);

  if (
    isNaN(
      date.getTime()
    )
  ) {

    return String(value);

  }

  return date.toLocaleString();

}


/************************************************************
 * HTML ESCAPE
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
