<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IRONCON Event QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; min-height: 100%;
      background: #111; font-family: Arial, Helvetica, sans-serif; color: white;
    }
    body { display: flex; justify-content: center; }
    .app { width: 100%; max-width: 600px; padding: 15px; }
    .header { text-align: center; padding: 15px 0; }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 6px 0 0; color: #bbb; }
    .event { margin: 10px 0; padding: 12px; border-radius: 10px; background: #222; text-align: center; font-size: 14px; color: #ddd; }
    #reader { width: 100%; margin: 15px auto; border-radius: 16px; overflow: hidden; background: #000; }
    #reader video { width: 100% !important; height: auto !important; object-fit: cover; }
    .button {
      width: 100%; padding: 17px; border: none; border-radius: 12px;
      font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    .start { background: #1976d2; color: white; }
    .stop { background: #444; color: white; }
    .scanner-status { text-align: center; padding: 12px; color: #ccc; }
    #result { display: none; margin-top: 20px; padding: 22px; border-radius: 15px; text-align: center; }
    #result.success { display: block; background: #1b5e20; }
    #result.error { display: block; background: #b71c1c; }
    #result.warning { display: block; background: #8d6e00; }
    #result.info { display: block; background: #263238; }
    .icon { font-size: 45px; }
    .name { font-size: 24px; font-weight: bold; margin: 10px 0; }
    .message { font-size: 17px; }
    .event-result { margin-top: 8px; font-size: 14px; opacity: .9; }
    .scan-again {
      width: 100%; margin-top: 15px; padding: 15px; border: none;
      border-radius: 10px; background: white; color: #222;
      font-size: 17px; font-weight: bold; cursor: pointer;
    }
    .manual { margin-top: 25px; border-top: 1px solid #333; padding-top: 20px; }
    .manual input {
      width: 100%; padding: 15px; border-radius: 10px; border: none;
      font-size: 17px; margin-top: 8px; text-transform: uppercase;
    }
    .manual button {
      width: 100%; margin-top: 8px; padding: 15px; border: none;
      border-radius: 10px; background: #555; color: white; font-size: 17px; cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>

<body>
<div class="app">

  <div class="header">
    <h1>IRONCON EVENT</h1>
    <p>QR Check-In Scanner</p>
  </div>

  <div id="eventInfo" class="event">
    Connecting to event API...
  </div>

  <div id="reader"></div>

  <div id="scannerStatus" class="scanner-status">
    Camera scanner is ready.
  </div>

  <button id="startButton" class="button start" onclick="startScanner()">
    📷 START CAMERA
  </button>

  <button id="stopButton" class="button stop hidden" onclick="stopScanner()">
    ⏹ STOP CAMERA
  </button>

  <div id="result"></div>

  <div class="manual">
    <strong>Manual Security Code</strong>
    <input id="manualCode" type="text" placeholder="Enter security code" autocomplete="off">
    <button onclick="sendCode()">CHECK CODE</button>
  </div>

</div>

<script>
/*
 * ============================================================
 * GITHUB PAGES CONFIGURATION
 * ============================================================
 *
 * This is the ONLY URL you need to change when connecting this
 * GitHub Pages scanner to a different Apps Script deployment.
 *
 * Use the deployed Apps Script Web App /exec URL.
 */
const API_URL =
  "https://script.google.com/macros/s/AKfycbzrYG0lR20QL19HhtVKD6jbY5xyK29p8wMg68w-U1inA_jPbSXdpKliPTJymJMMfaZb/exec";

/*
 * The scanner does NOT contain event details.
 * Event information comes from the Apps Script API.
 */

let scanner = null;
let scannerRunning = false;
let currentEvent = null;
let lastScan = "";
let lastScanTime = 0;


/*
 * ============================================================
 * INITIALIZE
 * ============================================================
 */

document.addEventListener("DOMContentLoaded", function () {
  loadActiveEvent();
});


/*
 * ============================================================
 * API REQUEST HELPER
 * ============================================================
 */

async function apiRequest(action, data = {}) {

  const params = new URLSearchParams();

  params.set("action", action);

  Object.keys(data).forEach(function (key) {
    params.set(key, data[key]);
  });

  const response =
    await fetch(API_URL + "?" + params.toString(), {
      method: "GET",
      cache: "no-store"
    });

  if (!response.ok) {
    throw new Error("API request failed: HTTP " + response.status);
  }

  return await response.json();
}


/*
 * ============================================================
 * GET ACTIVE EVENT
 * ============================================================
 */

async function loadActiveEvent() {

  try {

    const result =
      await apiRequest("getActiveEvent");

    if (
      !result ||
      result.success === false
    ) {

      throw new Error(
        result && result.message
          ? result.message
          : "Unable to get active event."
      );
    }

    currentEvent =
      result.event || result;

    displayEvent(currentEvent);

  } catch (error) {

    console.error(error);

    document.getElementById("eventInfo").textContent =
      "Unable to connect to event API.";

    setStatus(
      "Check the Apps Script API URL."
    );
  }
}


/*
 * ============================================================
 * DISPLAY ACTIVE EVENT
 * ============================================================
 */

function displayEvent(event) {

  if (!event) {
    return;
  }

  document.getElementById("eventInfo").innerHTML =
    "<strong>" +
    escapeHtml(event.name || "Active Event") +
    "</strong>" +
    "<br>" +
    escapeHtml(event.date || "") +
    " • " +
    escapeHtml(event.time || "") +
    "<br>" +
    escapeHtml(event.venue || "");

}


/*
 * ============================================================
 * START QR SCANNER
 * ============================================================
 */

async function startScanner() {

  if (scannerRunning) {
    return;
  }

  setStatus("Starting camera...");

  try {

    scanner =
      new Html5Qrcode("reader");

    const config = {

      fps: 10,

      qrbox: function (
        viewfinderWidth,
        viewfinderHeight
      ) {

        const minEdge =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          );

        const boxSize =
          Math.min(
            Math.floor(minEdge * 0.70),
            300
          );

        return {
          width: boxSize,
          height: boxSize
        };
      },

      aspectRatio: 1.0,

      rememberLastUsedCamera: true
    };


    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerRunning = true;

    document
      .getElementById("startButton")
      .classList.add("hidden");

    document
      .getElementById("stopButton")
      .classList.remove("hidden");

    setStatus(
      "Point the camera at the attendee QR code."
    );


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );

    scannerRunning = false;

    setStatus(
      "Unable to access camera."
    );

    showResult(
      "error",
      `
        <div class="icon">⚠️</div>
        <div class="message">
          Camera access failed.
          <br><br>
          Make sure you opened this page using HTTPS
          and allowed camera permission in Chrome.
        </div>
      `
    );
  }
}


/*
 * ============================================================
 * QR SUCCESS
 * ============================================================
 */

async function onScanSuccess(decodedText) {

  console.log(
    "QR CODE:",
    decodedText
  );

  await stopScanner();

  /*
   * The entire QR payload is sent to the API.
   *
   * This supports the new format:
   *
   * EVENT_ID=IR48-2026
   * SECURITY_CODE=IR48-ABC123
   *
   * It also supports a plain security code for backward
   * compatibility.
   */

  verifyCode(decodedText);
}


/*
 * Normal QR frame failures are ignored.
 */

function onScanFailure() {
  // Intentionally ignored.
}


/*
 * ============================================================
 * STOP SCANNER
 * ============================================================
 */

async function stopScanner() {

  if (!scanner || !scannerRunning) {
    return;
  }

  try {
    await scanner.stop();
  } catch (error) {
    console.warn("Scanner stop:", error);
  }

  try {
    await scanner.clear();
  } catch (error) {
    console.warn("Scanner clear:", error);
  }

  scannerRunning = false;

  document
    .getElementById("startButton")
    .classList.remove("hidden");

  document
    .getElementById("stopButton")
    .classList.add("hidden");

  setStatus("Scanner stopped.");
}


/*
 * ============================================================
 * VERIFY CODE THROUGH API
 * ============================================================
 */

async function verifyCode(code) {

  code =
    String(code || "").trim();

  if (!code) {

    showResult(
      "error",
      `
        <div class="icon">❌</div>
        <div class="message">
          Please scan or enter a security code.
        </div>
      `
    );

    return;
  }


  /*
   * Prevent duplicate scan submissions caused by camera
   * decoding the same QR multiple times.
   */

  const now =
    Date.now();

  if (
    code === lastScan &&
    now - lastScanTime < 3000
  ) {

    return;

  }

  lastScan = code;
  lastScanTime = now;


  showLoading();


  try {

    const result =
      await apiRequest(
        "verifySecurityCode",
        {
          code: code
        }
      );


    handleResult(result);


  } catch (error) {

    console.error(error);

    handleError(error);

  }
}


/*
 * ============================================================
 * MANUAL CODE
 * ============================================================
 */

function sendCode() {

  const input =
    document.getElementById(
      "manualCode"
    );

  const code =
    input.value.trim();

  verifyCode(code);
}


/*
 * ============================================================
 * HANDLE API RESULT
 * ============================================================
 */

function handleResult(result) {

  if (!result) {

    showResult(
      "error",
      `
        <div class="icon">❌</div>
        <div class="message">
          No response from server.
        </div>
      `
    );

    return;
  }


  if (result.success) {

    showResult(
      "success",
      `
        <div class="icon">✅</div>

        <div class="name">
          ${escapeHtml(result.name)}
        </div>

        <div class="message">
          CHECK-IN SUCCESSFUL
        </div>

        <div class="event-result">
          ${escapeHtml(result.eventName || "")}
        </div>

        <br>

        ${escapeHtml(result.checkInTime || "")}

        <button
          class="scan-again"
          onclick="scanAgain()"
        >
          📷 SCAN NEXT ATTENDEE
        </button>
      `
    );

    return;
  }


  if (result.alreadyCheckedIn) {

    showResult(
      "warning",
      `
        <div class="icon">⚠️</div>

        <div class="name">
          ${escapeHtml(result.name)}
        </div>

        <div class="message">
          ALREADY CHECKED IN
        </div>

        <div class="event-result">
          ${escapeHtml(result.eventName || "")}
        </div>

        <br>

        ${escapeHtml(result.checkInTime || "")}

        <button
          class="scan-again"
          onclick="scanAgain()"
        >
          📷 SCAN NEXT ATTENDEE
        </button>
      `
    );

    return;
  }


  showResult(
    "error",
    `
      <div class="icon">❌</div>

      <div class="message">
        ${escapeHtml(
          result.message ||
          "Invalid security code."
        )}
      </div>

      <button
        class="scan-again"
        onclick="scanAgain()"
      >
        📷 TRY AGAIN
      </button>
    `
  );
}


/*
 * ============================================================
 * SERVER ERROR
 * ============================================================
 */

function handleError(error) {

  console.error(error);

  showResult(
    "error",
    `
      <div class="icon">⚠️</div>

      <div class="message">
        Unable to communicate with the event API.
        <br><br>
        Check the API URL and deployment settings.
      </div>

      <button
        class="scan-again"
        onclick="loadActiveEvent()"
      >
        🔄 RETRY
      </button>
    `
  );
}


/*
 * ============================================================
 * SCAN AGAIN
 * ============================================================
 */

function scanAgain() {

  document
    .getElementById("result")
    .style.display = "none";

  document
    .getElementById("manualCode")
    .value = "";

  lastScan = "";
  lastScanTime = 0;

  startScanner();
}


/*
 * ============================================================
 * LOADING
 * ============================================================
 */

function showLoading() {

  showResult(
    "info",
    `
      <div class="icon">⏳</div>

      <div class="message">
        Verifying attendee...
      </div>
    `
  );
}


/*
 * ============================================================
 * STATUS
 * ============================================================
 */

function setStatus(message) {

  document
    .getElementById(
      "scannerStatus"
    )
    .textContent = message;
}


/*
 * ============================================================
 * RESULT DISPLAY
 * ============================================================
 */

function showResult(
  type,
  html
) {

  const result =
    document.getElementById(
      "result"
    );

  result.className =
    type;

  result.style.display =
    "block";

  result.innerHTML =
    html;
}


/*
 * ============================================================
 * HTML ESCAPING
 * ============================================================
 */

function escapeHtml(value) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}
</script>

</body>
</html>
